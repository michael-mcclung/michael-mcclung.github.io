<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="author" content="Michael McClung">
<meta name="theme-color" content="#050a11">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' mailto:; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; frame-src 'self'; connect-src 'self'; upgrade-insecure-requests">

<title>{% if page.title %}{{ page.title }} | {% endif %}Michael McClung | Full Stack Software Engineer</title>

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}Michael McClung | Full Stack Software Engineer">
<meta property="og:description" content="Michael McClung — Full Stack Software Engineer with enterprise experience in Java, Spring Boot, Angular, REST APIs, SQL, AWS, and CI/CD.">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/portrait.jpg' | absolute_url }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}Michael McClung">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
